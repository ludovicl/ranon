[package]
name = "ranon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Masks personal data in command output before it reaches an LLM agent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ludovicl/ranon"
readme = "README.md"
keywords = ["privacy", "pseudonymization", "llm", "psql", "claude"]
categories = ["command-line-utilities", "database"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
hex = "0.4.3"
hmac = "0.13.0"
regex = "1.13.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
serde_json = "1.0.154"
